# ─────────────────────────────────────────
# CORE SETTINGS
# ─────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 0          # zero latency for vim/neovim
set -g focus-events on
set -g base-index 1           # start windows at 1, not 0
setw -g pane-base-index 1     # start panes at 1
set -g renumber-windows on    # auto-renumber when you close a window

# ─────────────────────────────────────────
# KEYBINDINGS
# ─────────────────────────────────────────
# Remap prefix from Ctrl+b to Ctrl+a (easier)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split panes with | and - (intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# Resize panes with vim keys (hold prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config with r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ─────────────────────────────────────────
# COPY MODE (vim-style)
# ─────────────────────────────────────────
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# ─────────────────────────────────────────
# STATUS BAR
# ─────────────────────────────────────────
set -g status-position bottom
set -g status-interval 2
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'

# Left: session name
set -g status-left-length 40
set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold] 󱐋 #S #[bg=#1e1e2e,fg=#89b4fa]'

# Right: CPU, RAM, date/time
set -g status-right-length 120
set -g status-right '#{prefix_highlight} #[fg=#a6e3a1]#{cpu_percentage} CPU  #{ram_percentage} RAM #[fg=#89dceb] %H:%M #[fg=#cba6f7] %d %b'

# Window tabs
set -g window-status-format '#[fg=#6c7086] #I:#W '
set -g window-status-current-format '#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W '

# ─────────────────────────────────────────
# PANE BORDERS
# ─────────────────────────────────────────
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# ─────────────────────────────────────────
# PLUGINS (via TPM)
# ─────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'   # sane defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'  # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'  # auto-save sessions
set -g @plugin 'tmux-plugins/tmux-yank'       # system clipboard yank
set -g @plugin 'tmux-plugins/tmux-cpu'        # CPU/RAM in status bar
set -g @plugin 'tmux-plugins/tmux-prefix-highlight' # lights up when prefix pressed

# Auto-restore sessions on tmux start
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'


